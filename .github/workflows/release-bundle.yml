name: Release de mods Permaworld

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Version exacta de Minecraft (por ejemplo 26.3 o 26.3.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-bundle-${{ inputs.minecraft_version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m unittest discover -s scripts -p test_build_bundle.py
      - name: Seleccionar y compilar los mods
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_REPOS_TOKEN || github.token }}
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
        run: python scripts/build_bundle.py "$MINECRAFT_VERSION" --workdir "$RUNNER_TEMP/permaworld-bundle" --output dist
      - name: Publicar release conjunta
        env:
          GH_TOKEN: ${{ github.token }}
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
        run: |
          tag="bundle-mc${MINECRAFT_VERSION}-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.jar dist/SHA256SUMS.txt dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "Permaworld MC ${MINECRAFT_VERSION} · lote ${GITHUB_RUN_NUMBER}" \
            --notes-file dist/RELEASE_NOTES.md
