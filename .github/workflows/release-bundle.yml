name: Release de mods Permaworld

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Version exacta de Minecraft (por ejemplo 26.3 o 26.3.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-bundle-${{ inputs.minecraft_version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar acceso a los mods privados
        id: access
        env:
          REPOS_TOKEN: ${{ secrets.BUNDLE_REPOS_TOKEN }}
        run: |
          if [[ -z "$REPOS_TOKEN" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'Faltan secretos de lectura para los repositorios privados' >&2
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.access.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        if: steps.access.outputs.ready == 'true'
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.access.outputs.ready == 'true'
      - run: python -m unittest discover -s scripts -p test_build_bundle.py
        if: steps.access.outputs.ready == 'true'
      - name: Seleccionar y compilar los mods
        if: steps.access.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_REPOS_TOKEN }}
          MINECRAFT_VERSION: ${{ inputs.minecraft_version || '26.3' }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then args+=(--skip-unchanged); fi
          python scripts/build_bundle.py "$MINECRAFT_VERSION" --workdir "$RUNNER_TEMP/permaworld-bundle" --output dist "${args[@]}"
      - name: Publicar release conjunta
        if: steps.access.outputs.ready == 'true' && hashFiles('dist/manifest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MINECRAFT_VERSION: ${{ inputs.minecraft_version || '26.3' }}
        run: |
          tag="bundle-mc${MINECRAFT_VERSION}-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.jar dist/SHA256SUMS.txt dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "Permaworld MC ${MINECRAFT_VERSION} · lote ${GITHUB_RUN_NUMBER}" \
            --notes-file dist/RELEASE_NOTES.md
