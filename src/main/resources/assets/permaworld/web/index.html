<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Permaworld Logbook</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="glossy-overlay"></div>
<div class="app">
    <header class="topbar">
        <div>
            <h1>Permaworld Logbook</h1>
            <p>A persistent world, preserved for eternity</p>
        </div>
        <div class="topbar-actions">
            <div class="topbar-slider">
                <span>Glossy</span>
                <input id="glossySlider" type="range" min="0" max="100" value="50" class="mc-slider">
            </div>
        </div>
    </header>
    <nav class="global-tabs">
        <button data-tab="JUGADORES" class="mc-button tab-btn is-active">👤 Jugadores</button>
        <button data-tab="MAPA" class="mc-button tab-btn">🗺️ Mapa General</button>
        <button data-tab="ADMIN" class="mc-button tab-btn">💻 Consola Admin</button>
    </nav>
    <main class="layout view-jugadores">
        <aside class="rail panel">
            <div class="panel-title">Players</div>
            <input id="playerSearch" class="mc-input" type="search" placeholder="Search player">
            <div id="playerList" class="player-list"></div>
        </aside>
        <section class="timeline panel">
            <div class="toolbar">
                <div id="filterBar" class="filter-bar">
                    <button data-filter="ALL" class="mc-button is-active">Todos</button>
                    <button data-filter="DEATH" class="mc-button">Muertes</button>
                    <button data-filter="PATH_SAMPLE" class="mc-button">Caminos</button>
                    <button data-filter="GAME_MODE_CHANGE" class="mc-button">Modo de Juego</button>
                    <button data-filter="DIMENSION_CHANGE" class="mc-button">Dimensiones</button>
                    <button data-filter="ADVANCEMENT_DONE" class="mc-button">Logros</button>
                    <button data-filter="STATS" class="mc-button">Estadísticas</button>
                </div>
            </div>
            <div id="recordList" class="record-list"></div>
        </section>
        <aside class="detail panel">
            <div class="panel-title">Record</div>
            <div id="recordDetail" class="record-detail">Select a record.</div>
        </aside>
    </main>
</div>
<div id="mcTooltip" class="mc-tooltip"></div>
<script src="/app.js"></script>
</body>
</html>
